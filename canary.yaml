# Use this to simulate broken stuff this should detect.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orphan-test-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
#  storageClassName: if you need to set this to a non default storage class
---
apiVersion: v1
kind: Pod
metadata:
  name: orphan-test-pod
  namespace: default
spec:
  containers:
  - name: busybox
    image: busybox
    command:
      - "sleep"
      - "3600"
    volumeMounts:
    - mountPath: /data
      name: test-vol
  volumes:
  - name: test-vol
    persistentVolumeClaim:
      claimName: orphan-test-pvc
---
apiVersion: v1
kind: Pod
metadata:
  name: lorn-test-bitnami
  namespace: default
spec:
  containers:
    - name: redis
      image: bitnami/redis:7.0.15
    - name: nginx
      image: docker.io/bitnami/nginx:1.25.4
  initContainers:
    - name: wait
      image: bitnami/kubectl:1.29
  restartPolicy: Never
---
# This is a silly way to approach it, but you also need the local-path
# provisioner for this to be useful. Note, if your default storage class doesn't
# support snapshots you can ignore this part of the canary.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: lorn-test-csi-noss-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: lorn-test-csi-noss
  csi:
    driver: rancher.io/local-path
    volumeHandle: lorn-test-csi-noss-pv
    fsType: ext4
  hostPath:
    path: /tmp/lorn-test-csi-noss
    type: DirectoryOrCreate
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: lorn-test-csi-noss
provisioner: rancher.io/local-path
volumeBindingMode: Immediate
reclaimPolicy: Delete
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lorn-test-csi-noss-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: lorn-test-csi-noss
  volumeName: lorn-test-csi-noss-pv
---
apiVersion: v1
kind: Pod
metadata:
  name: lorn-test-csi-noss-pod
  namespace: default
spec:
  containers:
    - name: busybox
      image: busybox
      command: ["sleep", "3600"]
      volumeMounts:
        - mountPath: /data
          name: csi-noss-vol
  volumes:
    - name: csi-noss-vol
      persistentVolumeClaim:
        claimName: lorn-test-csi-noss-pvc
---
# Deployment (via its ReplicaSet) backing a Service that exposes a
# privileged (< 1024) port. Also exercises resolving the owning
# Deployment through the intermediate ReplicaSet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lorn-test-privileged-svc
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lorn-test-privileged-svc
  template:
    metadata:
      labels:
        app: lorn-test-privileged-svc
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: lorn-test-privileged-svc
  namespace: default
spec:
  selector:
    app: lorn-test-privileged-svc
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
